<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sis · Bugün</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6B58}a:hover{color:#2C4D3F}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F7F7F5; color: #1E2326; font-family: 'Inter', system-ui, sans-serif">
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 36px; padding: 32px 24px 0 24px; overflow: hidden">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #5E666B">İyi akşamlar</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Sevimli Panda</h1>
      </div>
      <button aria-label="Bildirimler, 2 okunmamış" style="position: relative; width: 44px; height: 44px; border: 1px solid #E2E3E0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1E2326">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
      </button>
    </header>

    <section aria-label="Seri" style="display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: flex-end; gap: 12px">
        <span style="font-size: 120px; line-height: 0.85; font-weight: 300; letter-spacing: -0.04em">12</span>
        <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px">
          <span style="font-size: 20px; font-weight: 600">gün</span>
          <span style="font-size: 13px; color: #5E666B">Rekor 21</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 30px; height: 30px; border-radius: 15px; background: {{accent}}"></span><span style="font-size: 12px; color: #5E666B">Pt</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 30px; height: 30px; border-radius: 15px; background: {{accent}}"></span><span style="font-size: 12px; color: #5E666B">Sa</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 28px; height: 28px; border-radius: 15px; border: 1px solid {{accent}}; box-sizing: content-box"></span><span style="font-size: 12px; font-weight: 600">Ça</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 30px; height: 30px; border-radius: 15px; background: #ECEDEA"></span><span style="font-size: 12px; color: #5E666B">Pe</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 30px; height: 30px; border-radius: 15px; background: #ECEDEA"></span><span style="font-size: 12px; color: #5E666B">Cu</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 30px; height: 30px; border-radius: 15px; background: #ECEDEA"></span><span style="font-size: 12px; color: #5E666B">Ct</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 30px; height: 30px; border-radius: 15px; background: #ECEDEA"></span><span style="font-size: 12px; color: #5E666B">Pz</span></div>
      </div>
    </section>

    <section aria-label="Bugünü değerlendir" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #FFFFFF; border: 1px solid #E8E9E6; border-radius: 16px">
      <span style="font-size: 16px; font-weight: 600">Bugün nasıl geçti?</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button style="height: 48px; border-radius: 12px; border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600">Başardım</button>
        <button style="height: 48px; border-radius: 12px; border: 1px solid #D9DAD6; background: #FFFFFF; color: #1E2326; font-size: 14px; font-weight: 500">Zorlandım</button>
        <button style="height: 48px; border-radius: 12px; border: 1px solid #D9DAD6; background: #FFFFFF; color: #1E2326; font-size: 14px; font-weight: 500">Başaramadım</button>
      </div>
    </section>

    <p style="margin: 0; font-size: 22px; line-height: 1.35; font-weight: 400; letter-spacing: -0.01em">“Yavaş ilerlemek de ilerlemektir.”</p>

    <nav aria-label="Kısayollar" style="display: flex; gap: 12px">
      <button aria-label="Nefes" style="width: 52px; height: 52px; border: 1px solid #E2E3E0; border-radius: 26px; background: transparent; color: #1E2326; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></button>
      <button aria-label="Oyunlar" style="width: 52px; height: 52px; border: 1px solid #E2E3E0; border-radius: 26px; background: transparent; color: #1E2326; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4"></circle><rect x="13" y="13" width="8" height="8" rx="2"></rect><path d="M17 3l4 7h-8z"></path></svg></button>
      <button aria-label="Destek al" style="width: 52px; height: 52px; border: 1px solid #E2E3E0; border-radius: 26px; background: transparent; color: #1E2326; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><path d="m4.9 4.9 4.3 4.3M14.8 9.2l4.3-4.3M14.8 14.8l4.3 4.3M9.2 14.8l-4.3 4.3"></path></svg></button>
    </nav>
  </main>

  <button style="position: absolute; right: 20px; bottom: 96px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px; border: none; border-radius: 24px; background: #1E2326; color: #FFFFFF; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>Şu an zorlanıyorum</button>

  <nav aria-label="Ana gezinme" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 76px; border-top: 1px solid #E8E9E6; background: #F7F7F5">
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: none; background: transparent; color: #1E2326; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg>Bugün<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span></button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: none; background: transparent; color: #5E666B; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg>Topluluk<span style="width: 4px; height: 4px"></span></button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: none; background: transparent; color: #5E666B; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4 0-8-3-8-8 4 0 8 3 8 8Z"></path><path d="M12 20c4 0 8-3 8-8-4 0-8 3-8 8Z"></path><path d="M12 20c-2-3-2-9 0-14 2 5 2 11 0 14Z"></path></svg>Sakinleş<span style="width: 4px; height: 4px"></span></button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: none; background: transparent; color: #5E666B; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg>Profil<span style="width: 4px; height: 4px"></span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3F6B58","options":["#3F6B58","#3E5F8A","#7A5C8E","#8A6A3F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#3F6B58' };
  }
}
</script>
</body>
</html>
