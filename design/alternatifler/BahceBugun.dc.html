<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bahçe · Bugün</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D4A}a:hover{color:#1F4434}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #EEF3EC; color: #1F2D27; font-family: 'Outfit', system-ui, sans-serif">
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px; padding: 28px 20px 0 20px; overflow: hidden">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #55665D">İyi akşamlar</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 600">Sevimli Panda</h1>
      </div>
      <button aria-label="Bildirimler, 2 okunmamış" style="position: relative; width: 46px; height: 46px; border: none; border-radius: 23px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F2D27">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 4px; background: #D9A04A"></span>
      </button>
    </header>

    <section aria-label="Seri" style="display: flex; align-items: center; justify-content: center; gap: 24px; padding: 22px 20px; background: #DCE8DB; border-radius: 28px">
      <svg width="124" height="160" viewBox="0 0 120 150" role="img" aria-label="12 gündür büyüyen bir fidan">
        <circle cx="104" cy="16" r="9" fill="#E9B872"></circle>
        <path d="M60 106 C60 82 57 62 62 30" stroke="{{accent}}" stroke-width="4" fill="none" stroke-linecap="round"></path>
        <ellipse cx="44" cy="86" rx="17" ry="8" transform="rotate(-25 44 86)" fill="#7BA889"></ellipse>
        <ellipse cx="77" cy="74" rx="18" ry="8" transform="rotate(25 77 74)" fill="{{accent}}"></ellipse>
        <ellipse cx="45" cy="58" rx="15" ry="7" transform="rotate(-30 45 58)" fill="{{accent}}"></ellipse>
        <ellipse cx="77" cy="46" rx="14" ry="7" transform="rotate(30 77 46)" fill="#7BA889"></ellipse>
        <ellipse cx="62" cy="25" rx="7" ry="11" fill="#7BA889"></ellipse>
        <rect x="26" y="104" width="68" height="12" rx="5" fill="#B98F6A"></rect>
        <path d="M31 116 H89 L83 146 H37 Z" fill="#C9A27E"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: baseline; gap: 6px">
          <span style="font-size: 64px; font-weight: 600; line-height: 1; color: {{accent}}">12</span>
          <span style="font-size: 18px; font-weight: 500">gün</span>
        </div>
        <span style="font-size: 14px; color: #3F5148">Rekor 21</span>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14Z"></path></svg><span style="font-size: 12px; color: #55665D">Pt</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14Z"></path></svg><span style="font-size: 12px; color: #55665D">Sa</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14Z"></path><path d="M5 19 13 11"></path></svg><span style="font-size: 12px; font-weight: 600; color: #1F2D27">Ça</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B8C8B6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14Z"></path></svg><span style="font-size: 12px; color: #55665D">Pe</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B8C8B6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14Z"></path></svg><span style="font-size: 12px; color: #55665D">Cu</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B8C8B6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14Z"></path></svg><span style="font-size: 12px; color: #55665D">Ct</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B8C8B6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14Z"></path></svg><span style="font-size: 12px; color: #55665D">Pz</span></div>
    </div>

    <section aria-label="Bugünü değerlendir" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #FFFFFF; border-radius: 24px">
      <span style="font-size: 16px; font-weight: 600">Bugün nasıl geçti?</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button style="height: 52px; border: none; border-radius: 18px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600">Başardım</button>
        <button style="height: 52px; border: none; border-radius: 18px; background: #F4EBD8; color: #1F2D27; font-size: 15px; font-weight: 500">Zorlandım</button>
        <button style="height: 52px; border: none; border-radius: 18px; background: #EAEEEA; color: #1F2D27; font-size: 15px; font-weight: 500">Başaramadım</button>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
      <span style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 17px; background: #F4EBD8; color: #9A6B23; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg></span>
      <p style="margin: 0; font-size: 17px; line-height: 1.4">Yavaş ilerlemek de ilerlemektir.</p>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: 2px solid {{accent}}; border-radius: 26px; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>Şu an zorlanıyorum</button>
      <button aria-label="Nefes" style="width: 52px; height: 52px; border: none; border-radius: 26px; background: #FFFFFF; color: #1F2D27; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></button>
      <button aria-label="Oyunlar" style="width: 52px; height: 52px; border: none; border-radius: 26px; background: #FFFFFF; color: #1F2D27; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4"></circle><rect x="13" y="13" width="8" height="8" rx="2"></rect><path d="M17 3l4 7h-8z"></path></svg></button>
    </div>
  </main>

  <nav aria-label="Ana gezinme" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 76px; background: #FFFFFF; border-radius: 24px 24px 0 0">
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: {{accent}}; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 30px; border-radius: 15px; background: #DCE8DB; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg></span>Bugün</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #55665D; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span>Topluluk</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #55665D; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4 0-8-3-8-8 4 0 8 3 8 8Z"></path><path d="M12 20c4 0 8-3 8-8-4 0-8 3-8 8Z"></path><path d="M12 20c-2-3-2-9 0-14 2 5 2 11 0 14Z"></path></svg></span>Sakinleş</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #55665D; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg></span>Profil</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5D4A","options":["#2F5D4A","#3B5F7A","#5E4F84","#7A5A2E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F5D4A' };
  }
}
</script>
</body>
</html>
