    </article>

    <article style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; background: #FFFFFF; border: 2px solid #2A2540; border-radius: 22px; box-shadow: 0 4px 0 #2A2540">
      <div style="display: flex; align-items: center; gap: 10px">

      <div style="display: flex; gap: 8px">
        <button aria-label="Yanıtlar" style="display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 2px solid #2A2540; border-radius: 14px; background: #FFFFFF; color: #2A2540; font-size: 13px; font-weight: 800"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>9</button>

        <span style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; background: #FFE3CF; border: 2px solid #2A2540; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900">SA</span>

    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #5C5675; font-size: 12px; font-weight: 700"><span style="width: 58px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4 0-8-3-8-8 4 0 8 3 8 8Z"></path><path d="M12 20c4 0 8-3 8-8-4 0-8 3-8 8Z"></path><path d="M12 20c-2-3-2-9 0-14 2 5 2 11 0 14Z"></path></svg></span>Sakinleş</button>
