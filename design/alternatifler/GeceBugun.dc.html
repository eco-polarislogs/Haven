<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gece Limanı · Bugün</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2B35E}a:hover{color:#F7CB8A}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0D1B24; color: #E8EEF1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 26px; padding: 28px 20px 0 20px; overflow: hidden">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #A3B6C0">İyi akşamlar</span>
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">Sevimli Panda</h1>
      </div>
      <button aria-label="Bildirimler, 2 okunmamış" style="position: relative; width: 46px; height: 46px; border: 1px solid #24414F; border-radius: 23px; background: #142733; display: flex; align-items: center; justify-content: center; color: #E8EEF1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
      </button>
    </header>

    <section aria-label="Seri" style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="position: relative; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center">
        <span style="position: absolute; width: 130px; height: 130px; border-radius: 65px; box-shadow: 0 0 80px 12px {{glow}}"></span>
        <svg width="190" height="190" viewBox="0 0 190 190" style="position: absolute; top: 0; left: 0; transform: rotate(-90deg)" aria-hidden="true"><circle cx="95" cy="95" r="84" fill="none" stroke="#1B3341" stroke-width="10"></circle><circle cx="95" cy="95" r="84" fill="none" stroke="{{accent}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="301 528"></circle></svg>
        <div style="position: relative; display: flex; flex-direction: column; align-items: center">
          <span style="font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.03em">12</span>
          <span style="font-size: 14px; color: #A3B6C0">gün</span>
        </div>
      </div>
      <span style="font-size: 13px; color: #A3B6C0">Rekor 21</span>
    </section>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: {{accent}}; box-shadow: 0 0 10px {{accent}}"></span><span style="font-size: 12px; color: #A3B6C0">Pt</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: {{accent}}; box-shadow: 0 0 10px {{accent}}"></span><span style="font-size: 12px; color: #A3B6C0">Sa</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 7px; border: 2px solid {{accent}}"></span><span style="font-size: 12px; font-weight: 700">Ça</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: #1E3A48"></span><span style="font-size: 12px; color: #A3B6C0">Pe</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: #1E3A48"></span><span style="font-size: 12px; color: #A3B6C0">Cu</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: #1E3A48"></span><span style="font-size: 12px; color: #A3B6C0">Ct</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: #1E3A48"></span><span style="font-size: 12px; color: #A3B6C0">Pz</span></div>
    </div>

    <section aria-label="Bugün nasıl geçti?" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 86px; border: 1px solid #24414F; border-radius: 18px; background: #142733; color: #E8EEF1; font-size: 13px; font-weight: 600"><span style="width: 34px; height: 34px; border-radius: 17px; background: #6FC1BE; color: #0D1B24; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Başardım</button>
      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 86px; border: 1px solid #24414F; border-radius: 18px; background: #142733; color: #E8EEF1; font-size: 13px; font-weight: 600"><span style="width: 34px; height: 34px; border-radius: 17px; background: {{accent}}; color: #0D1B24; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg></span>Zorlandım</button>
      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 86px; border: 1px solid #24414F; border-radius: 18px; background: #142733; color: #E8EEF1; font-size: 13px; font-weight: 600"><span style="width: 34px; height: 34px; border-radius: 17px; background: #D39A82; color: #0D1B24; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"></path></svg></span>Başaramadım</button>
    </section>

    <p style="margin: 0; text-align: center; font-size: 16px; line-height: 1.45; color: #C9D6DC">“Yavaş ilerlemek de ilerlemektir.”</p>

    <div style="display: flex; gap: 8px">
      <button style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: 1px solid {{accent}}; border-radius: 26px; background: transparent; color: {{accent}}; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>Şu an zorlanıyorum</button>
      <button aria-label="Nefes" style="width: 52px; height: 52px; border: 1px solid #24414F; border-radius: 26px; background: #142733; color: #E8EEF1; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></button>
      <button aria-label="Oyunlar" style="width: 52px; height: 52px; border: 1px solid #24414F; border-radius: 26px; background: #142733; color: #E8EEF1; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4"></circle><rect x="13" y="13" width="8" height="8" rx="2"></rect><path d="M17 3l4 7h-8z"></path></svg></button>
    </div>
  </main>

  <nav aria-label="Ana gezinme" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 76px; border-top: 1px solid #1B3341; background: #0F2029">
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: {{accent}}; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 30px; border-radius: 15px; background: #1F3542; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg></span>Bugün</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #A3B6C0; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span>Topluluk</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #A3B6C0; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4 0-8-3-8-8 4 0 8 3 8 8Z"></path><path d="M12 20c4 0 8-3 8-8-4 0-8 3-8 8Z"></path><path d="M12 20c-2-3-2-9 0-14 2 5 2 11 0 14Z"></path></svg></span>Sakinleş</button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #A3B6C0; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg></span>Profil</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2B35E","options":["#F2B35E","#7FC8C4","#B9A6F0","#F0A08A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F2B35E';
    return { accent, glow: accent + '40' };
  }
}
</script>
</body>
</html>
