name: haven
description: "Haven - güvenli liman: şefkat odaklı iyileşme yol arkadaşı."
publish_to: 'none'
version: 3.3.0+5

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.2.0
  firebase_analytics: ^13.1.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  google_mlkit_translation: ^1.0.3
  google_mobile_ads: ^9.2.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  # Tasarımların yazı tipleri (SIL Open Font License; lisans metinleri
  # assets/fonts/licenses/ altında, uygulamanın Lisanslar sayfasında görünür).
  assets:
    - assets/fonts/licenses/
  fonts:
    - family: Inter # Sis, Defter (gövde)
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: PlusJakartaSans # Gece Limanı
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: Outfit # Bahçe
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
    - family: Nunito # Neşeli
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
    - family: Lora # Defter (başlıklar)
      fonts:
        - asset: assets/fonts/Lora-500.ttf
          weight: 500
        - asset: assets/fonts/Lora-600.ttf
          weight: 600
        - asset: assets/fonts/Lora-700.ttf
          weight: 700
    - family: AtkinsonNext # Net
      fonts:
        - asset: assets/fonts/AtkinsonNext-400.ttf
        - asset: assets/fonts/AtkinsonNext-700.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonNext-800.ttf
          weight: 800
